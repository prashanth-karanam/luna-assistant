name: Build & Release Luna APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK with Gradle
        run: |
          gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Luna Voice Assistant APK v1.0.${{ github.run_number }}
          body: |
            ✨ **Luna Voice Assistant - Direct Downloadable APK**
            
            - 🌙 **Siri / Gemini Style Glassmorphic Overlay UI**
            - 🎙️ **Voice Activation & Speech Recognition Engine**
            - ⚡ **Direct APK Installation for Android**
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
